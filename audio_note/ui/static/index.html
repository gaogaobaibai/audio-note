<!doctype html>

<title>audio-note</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233A56D4'/%3E%3Crect x='12.5' y='6' width='7' height='13' rx='3.5' fill='white'/%3E%3Cpath d='M8.5 15.5a7.5 7.5 0 0 0 15 0' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M16 23v3.5' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* apply the saved theme before first paint (the module code keeps it in sync afterwards: js/core/theme.js) */
try { var t = JSON.parse(localStorage.getItem("audio-note:prefs:v1") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css?v=__V__">
<link rel="modulepreload" href="/static/js/main.js">
<link rel="modulepreload" href="/static/js/core/util.js">
<link rel="modulepreload" href="/static/js/core/html.js">
<link rel="modulepreload" href="/static/js/core/dom.js">
<link rel="modulepreload" href="/static/js/core/api.js">
<link rel="modulepreload" href="/static/js/core/bus.js">
<link rel="modulepreload" href="/static/js/core/store.js">
<link rel="modulepreload" href="/static/js/core/router.js">
<link rel="modulepreload" href="/static/js/core/status.js">
<link rel="modulepreload" href="/static/js/ui/icons.js">
<link rel="modulepreload" href="/static/js/ui/components.js">
<link rel="modulepreload" href="/static/js/ui/shell.js">

</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="主导航">
    <a class="brand" href="#/dashboard" aria-label="audio-note 总览">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="9" fill="currentColor"/><rect x="12.5" y="6" width="7" height="13" rx="3.5" fill="var(--on-accent)"/><path d="M8.5 15.5a7.5 7.5 0 0 0 15 0" stroke="var(--on-accent)" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M16 23v3.5" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <span class="brand-name">audio-note</span>
    </a>
    <nav class="rail-nav" id="nav" aria-label="页面"></nav>
    <div class="rail-foot">
      <button type="button" class="nav-item rail-toggle" id="rail-toggle" aria-controls="rail" aria-expanded="true" aria-label="收起导航栏">
        <span class="nav-ic"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></span><span class="nav-label">收起</span>
      </button>
    </div>
  </aside>
  <div class="frame">
    <header class="topbar" id="topbar">
      <h1 class="topbar-title" id="page-title"></h1>
      <button type="button" class="search-trigger" id="palette-btn" aria-label="搜索记录或输入命令" aria-keyshortcuts="Control+K">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="search-hint">搜索记录或输入命令</span><kbd id="palette-kbd">Ctrl K</kbd>
      </button>
      <div class="topbar-right">
        <div id="rec-pill" class="rec-slot"></div>
        <button type="button" class="icon-btn has-badge" id="bell-btn" aria-label="待确认" hidden></button>
        <button type="button" class="icon-btn" id="theme-btn" aria-label="切换主题"></button>
        <button type="button" class="profile-btn" id="profile-btn" aria-label="切换档案" title="切换档案（不同的人 / 用途各自独立的录音、记录、说话人）"></button>
      </div>
    </header>
    <div id="banner" aria-live="polite"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
<div class="player" id="player" hidden></div>
<div id="modal-root"></div>
<div id="pop-root"></div>
<div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
